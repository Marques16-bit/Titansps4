name: Extrair repo.zip

on:
  push:
    paths:
      - 'repo.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair na raiz
        run: |
          if [ ! -f repo.zip ]; then echo "Sem repo.zip na raiz: nada a fazer"; exit 0; fi
          rm -rf /tmp/x && mkdir -p /tmp/x
          unzip -q -o repo.zip -d /tmp/x
          rm -rf /tmp/x/__MACOSX
          src=/tmp/x
          # zip com uma pasta única (ex.: Titans-PS4/): usa o conteúdo dela
          if [ "$(ls -A /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then
            src="/tmp/x/$(ls -A /tmp/x)"
          fi
          # o GITHUB_TOKEN não pode alterar .github/workflows
          rm -rf "$src/.github"
          cp -a "$src"/. .
          rm -f repo.zip

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Extrai repo.zip"
          git push
